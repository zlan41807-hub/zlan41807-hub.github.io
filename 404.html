<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Page not found — JFA | Jinfang Architectural Design</title>
<meta http-equiv="refresh" content="5; url=https://jfadesign.com/">
<style>
  :root { --gold:#C4975A; --ink:#2A2D31; --muted:#8B8F96; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#141618; color:#EDEFF2;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif; }
  .box { max-width:640px; padding:48px 32px; text-align:center; }
  .code { font-size:13px; letter-spacing:.28em; color:var(--gold); text-transform:uppercase; }
  h1 { font-size:32px; line-height:1.3; margin:18px 0 10px; font-weight:600; }
  p { color:var(--muted); font-size:15px; line-height:1.8; margin:0 0 28px; }
  a.btn { display:inline-block; padding:13px 30px; border:1px solid var(--gold); color:var(--gold);
          text-decoration:none; border-radius:2px; font-size:14px; letter-spacing:.08em; transition:.25s; }
  a.btn:hover { background:var(--gold); color:var(--ink); }
</style>
</head>
<body>
  <div class="box">
    <div class="code">Error 404</div>
    <h1>This page has moved or never existed.<br>页面不存在或已移动</h1>
    <p>Redirecting to the homepage in 5 seconds.<br>5 秒后自动返回首页。</p>
    <a class="btn" href="https://jfadesign.com/">Back to Home · 返回首页</a>
  </div>
</body>
</html>
