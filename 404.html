<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found / 页面不存在 — 谨防建筑 JFA</title>
<meta name="robots" content="noindex, follow">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #2A2D31; color: #EDEAE4; padding: 32px;
    font-family: Inter, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 620px; text-align: center; }
  .code { font-size: 78px; font-weight: 700; letter-spacing: 2px; color: #C4975A; line-height: 1; }
  h1 { font-size: 22px; font-weight: 600; margin: 18px 0 6px; }
  h1.zh { font-size: 16px; opacity: .68; font-weight: 500; margin: 0 0 22px; }
  p { font-size: 14px; line-height: 1.75; opacity: .72; margin: 0 0 26px; }
  a.btn {
    display: inline-block; padding: 12px 26px; border: 1px solid #C4975A; border-radius: 4px;
    color: #C4975A; text-decoration: none; font-size: 14px; letter-spacing: .06em;
    transition: background .25s ease, color .25s ease;
  }
  a.btn:hover { background: #C4975A; color: #2A2D31; }
  .sep { width: 46px; height: 1px; background: #C4975A; opacity: .5; margin: 0 auto 24px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page doesn't exist.</h1>
    <h1 class="zh">页面不存在或已被移动。</h1>
    <div class="sep"></div>
    <p>The address may be misspelled, or the page has moved.<br>
       地址可能输入有误，或页面已迁移。</p>
    <a class="btn" href="https://jfadesign.com/">Back to Home / 返回首页</a>
  </div>
</body>
</html>
